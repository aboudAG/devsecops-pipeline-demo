name: deploy-kind

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-kind:
    name: deploy-to-kind
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: devsecops-demo
      - name: Build image
        run: docker build -t devsecops-pipeline-demo:local .
      - name: Load image in kind
        run: kind load docker-image devsecops-pipeline-demo:local --name devsecops-demo
      - name: Deploy manifests
        run: kubectl apply -f k8s
      - name: Wait for deployment
        run: kubectl rollout status deployment/devsecops-pipeline-demo
      - name: Test service
        run: kubectl run curl --rm -i --restart=Never --image=curlimages/curl:8.16.0 --command -- curl --fail --show-error --silent http://devsecops-pipeline-demo/health
